[package]
name = "jolt-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
jolt-core = { git = "https://github.com/a16z/jolt.git", rev = "997c1543", features = ["host"], default-features = false }
common = { git = "https://github.com/a16z/jolt.git", rev = "997c1543", features = ["std"], default-features = false }
# Registers the SHA-256 inline sequence builder via a #[ctor::ctor] on load.
# Required for proving any ELF that uses `jolt_inlines_sha2` — without this,
# the tracer panics with "No inline sequence builder registered for
# opcode=0x0b".
jolt-inlines-sha2 = { git = "https://github.com/a16z/jolt.git", rev = "997c1543", features = ["host"] }
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false, features = ["derive"] }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false }
clap = { version = "4.5", features = ["derive"] }
mimalloc = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[patch.crates-io]
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }

[profile.release]
opt-level = 3
lto = "fat"
debug = true
