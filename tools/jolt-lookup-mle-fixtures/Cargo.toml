[package]
name = "jolt-lookup-mle-fixtures"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jolt-lookup-mle-fixtures"
path = "src/main.rs"

# This generator intentionally has no floating external dependencies. The
# checked-in fixture records the upstream Jolt revision it was generated from;
# rerunning this binary copies that reproducible fixture to the requested path.

[profile.release]
opt-level = 3
