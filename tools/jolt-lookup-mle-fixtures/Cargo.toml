[package]
name = "jolt-lookup-mle-fixtures"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jolt-lookup-mle-fixtures"
path = "src/main.rs"

# The generator is dependency-free for old toolchain compatibility. It records
# the pinned upstream Jolt revision and emits the independently committed rows
# regenerated from that revision.

[profile.release]
opt-level = 3
